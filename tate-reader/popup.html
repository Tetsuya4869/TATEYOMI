<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px; padding: 12px;
      font-family: -apple-system, sans-serif; font-size: 14px;
      margin: 0; background: #fff; color: #1a1a1a;
    }
    h1 { font-size: 13px; margin: 0 0 10px; color: #555; }
    button {
      width: 100%; padding: 8px; margin-bottom: 8px;
      background: #1a1a1a; color: #fff; border: none;
      border-radius: 6px; font-size: 14px; cursor: pointer;
    }
    button:active { background: #444; }
    label {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; cursor: pointer; padding: 4px 0;
    }
    input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>縦組みリーダー</h1>
  <button id="btn-toggle">縦書きON/OFF</button>
  <label>
    <input type="checkbox" id="chk-always">
    このサイトを自動で縦書き
  </label>
  <script src="popup.js"></script>
</body>
</html>
